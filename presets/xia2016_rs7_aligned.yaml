# rc7 PRESET: Xia 2016 RS-7 aligned with Fig. 3 (the rc6 variant xia2016_rs7_depicted_fig3 with the taper of XIA-1).
#   centre_channel.shear_formula: parallel_plates (rc7, XIA-1): A DEPARTURE from spec v5 S16-b (constant shear with
#     C(alpha), S:456; "max gamma_dot via C(alpha) [NEVER 6]", S:606), REPRODUCE MODE ONLY.  The constant-shear taper
#     300 -> 150 um holds the parallel-plate maximum wall shear 6 Q / (w_c h^2), so w_c is proportional to the centre
#     flow; it puts leg 3's centre widths on panels d and e (218.1 / 186.1 um against 219.8 / 186.0; rc6's exact
#     C(alpha): 230.9 / 205.5), A: chosen with those panels in view, which are then consistency, not a test.  Xia's text
#     does not state the shear coefficient.  The true peak shear via C(alpha) is 1.34-1.57 x the parallel-plate value
#     and rises 17.4 % along the taper (the record's validation.gates.shear_peak).  Panel f is not matched (register
#     INV-4, open): its outer side-channel walls lie 39.9 / 36.0 um inside this mask's (left / right, at panel f's
#     1.774 um/px; about 7 um less at 1.798), more than on rc6's variant; panel g matches because F is fitted to it.
#   F 0.9407200 (15.87 : 1) -- D (fitted) through the frozen model to Fig. 3g's last side channel, 624.6 um (M);
#   D 6.415908 um (x 0.9347 of the printed-f_ref 6.8644) -- D (fitted) through the frozen model: the cutoff at which the
#     rows fill Fig. 3a's legs at that F (N 8106, xia_leg_fill.py's goal).
# Solved alternately as rc6's xia_fig3_fit.py, with the taper option set (provenance/rc7_scripts/xia_fig3_fit_pp.py ->
# xia_fig3_fit_pp.json).  The text's values (D 6.8644 um, F 0.938) stay in xia2016_rs7_depicted (the printed reference).
# Xia 2016 RS-7, the head AS DEPICTED (Figs. 3b + 3a), reproduced from its decoupled targets (here: read off the figures).
name: xia2016_rs7_aligned
description: Xia 2016 RS-7 aligned with Fig. 3 -- constant-shear (parallel-plate) taper 300 -> 150 um, hairpin head, 7-leg paperclip (Fig. 3a axes), ring outlet
targets: {cutoff_um: 6.415908497774869, filtrate_fraction: 0.9407199784857051}
process: {depth_um: 140, gap_um: 16, post_length_um: 35.8, post_width_um: 70.9, min_feature_um: 16, min_radius_um: 4.5}
centre_channel: {taper: constant_shear, width_in_um: 300, width_min_um: 150, shear_formula: parallel_plates}
layout: {style: paperclip, legs: 7}
meander: {enabled: true, style: hairpins, channel_um: 22.8, wall_um: 35.8, head_width_um: 1840, seal: allow,
          transition: paper, seam_side_width_um: 16, seam_at: post}   # rectilinear rows: the depicted head's 76 (Fig. 1c's nine are xia2016_rs7_specified's; rc7: a spec value the reproduction block replaces is refused)
inlet: {style: plain, port_radius_um: 862, stem_half_width_um: 166, port_gap_um: 591}
outlet: {style: ring, port_radius_um: 1718, centre_port_radius_um: 1723,
         tubing: {centre_id_mm: 0.25, side_id_mm: 0.86, length_m: 0.15},
         ring: {radius_um: 4195, centre_offset_um: 1191, filtrate_port_offset_um: 4781, turn_radius_um: 250}}
gates: {mode: reproduce}
reproduction:
  margin: 20.0
  ws_rect: 22.8
  leg_Y: [0.0, 1332.0, -1745.0, 2229.0, -2650.0, 3267.0, -3975.0]
  pc_inlet_offset: 2553.0
  pc_out_ext: 3441.0
  loop_pull_in: 2.0
  loop_pull_in_leg: true
  loop_ramp: 40.0
  depicted_head: xia
paper:
  source: Xia et al. 2016 Sci. Rep., Figs. 1, 3 and p. 4; tubing length 0.15 m assumed (only the I.D.s are printed); rc6 -- Fig. 3 panels b-g read at 1.798 um/px (their printed widths and loop curvature; the panel-i bar gives 1.936), Fig. 3a at its bar read with its anti-aliased ends (x 1.003827)
  targets_fitted: "F 0.94072, fitted to Fig. 3g's last side channel (624.6 um; 15.9 : 1, printed ~15 : 1); D 6.4159 um, fitted to Fig. 3a's leg fill at that F with the parallel-plate taper (register XIA-1)"
  source_trace:   # rc7 (ADJ-C6, code review R10; codereview3 M1: exact paths): the trace records of this mask against the figures
    - provenance/rc7_traces/results/xia/xia_results_pp.json
    - provenance/rc7_traces/results/xia/xia_results_fig3c_pp.json
    - provenance/rc7_traces/results/xia/xia_results_fig3d_pp.json
    - provenance/rc7_traces/results/xia/xia_results_fig3e_pp.json
    - provenance/rc7_traces/results/xia/xia_results_fig3f_pp.json
    - provenance/rc7_traces/results/xia/xia_fig3a_device_pp.json
# flow: Xia ran RS-7 at "~1 mL/min" (line 18) and ">0.75 mL/min" (line 244); 800 uL/min is used (printed range)
operation: {flow_uL_min: 800}
