# Gifford 2014 Fig. 5C: one of four 125 um-deep bead devices (f_gap 6.0e-4; w_c 100 um; final side width 450 um).
# The strongest quantitative cutoff test in the three papers: measured 50%-retention sizes (Fig. 5, Coulter counts) can be
# compared with D.  As fabricated: no meander, sealed start at a 12.5 um side width: ASSUMED, by applying the 10:1 aspect
# ratio Gifford mentions when discussing pore size against depth (p. 4503) to the 125 um depth.
# Layout NOT PUBLISHED for Fig. 5: drawn as a nested paperclip fitted to a 30 x 50 mm area (ASSUMED); G, g_p, l_g as
# Fig. 4 (ASSUMED: same lab and period, not printed for Fig. 5).
name: gifford2014_fig5C_as_fabricated_12p5um
description: Gifford 2014 Fig. 5C (f_gap 6.0e-4) as fabricated at a 12.5 um start (layout assumed)
targets:
  cutoff_um: 6.9823               # kappa_g x(f_gap) w_c, w_c 100 um
  filtrate_fraction: 0.95748    # outlet identity at the printed final side width 450 um (text: ~23:1; caption: 24.4x)
process: {depth_um: 125, gap_um: 20.5, post_length_um: 25.3, post_width_um: 59.5, min_feature_um: 12.5}
chip: {width_mm: 30, length_mm: 50, margin_um: 1000}
centre_channel: {taper: constant, width_in_um: 100}
layout: {style: paperclip, legs: auto}
meander: {enabled: false}
start: {style: floor, side_width_um: 12.5}
inlet: {style: plain, port_radius_um: 300}
outlet: {style: separate, port_radius_um: 750, centre_port_radius_um: 300}
operation: {flow_uL_min: 25}       # printed (Fig. 5 text)
gates: {mode: reproduce}
paper:
  source: Gifford et al. 2014, Fig. 5 caption and pp. 4500-4501
  measured: Fig. 5 enrichment by bead size (4, 6, 8, 10 um nominal) at 25 uL/min
