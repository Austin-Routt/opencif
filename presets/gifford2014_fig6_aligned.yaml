# Gifford 2014, Fig. 6 platelet device -- ALIGNED reproduction (A. H. Routt, 2026-10-18: full alignment; rc7 preset, from
# the rc6 Fig. 6 package, version 2).  Gifford's printed
# design (f_gap 1.04e-4 at w_c 125 um, depth 150 um, seven nested legs, 55 uL/min) with:
#   final side width 144 um: PRINTED in the text (p. 4502); the caption says 140 um (Gifford's caption-text conflict,
#     stated in the dissertation); the micrograph reads 145.5 um at leg 7's end.
#   start: the first side channel 40 um wide (Gifford p. 4498's start rule; spec v5 section 8 DIRECT mode; App. A's
#     "other start mode"; the glossary's sigma0, a supplied input).  D, FITTED to a measurement: the start that puts
#     leg 1's side channels at the width the micrograph shows (58.9 um M), through the frozen row-fraction law
#     (provenance/rc7_scripts/gifford_alignment.py; the package's measure step); legs 3 and 5 test it in part (the text's
#     144 um, which sets leg 7's end through F, was preferred over the caption's 140 um with legs 3 and 5 in view:
#     GIF6-2; leg 7 is not a test).  It declares an off-design entrance: rows 1-40 above D, row 1 at 9.9 D (35.9 um),
#     14.5 % of F.  Its early side flow (App. A's mass defect 2 sigma0 = 0.11 of the inlet flow, ~10 % of the mass
#     identity's 1 + 2 sigma0) is consistent with the 83 % platelet recovery (Gifford's "yield", not App. B's F; rc7 INV-2).
#   gap: 17.1 um, posts 34.3 um along the flow (row pitch 51.4 um unchanged): M, measured on the micrograph
#     (rc6 gifford_fig6_measurement.json: G_read 17.08, post_along_flow 34.3).  The gap does not enter the schedule.
# The design-level preset (gifford2014_fig6_design: sealed start, caption's 140 um, G 20.5) is the package's rc6 reference.
name: gifford2014_fig6_aligned
description: Gifford 2014 Fig. 6 platelet device, aligned with the Fig. 6 micrograph (printed design, text's 144 um final width; 40 um start and 17.1 um gap measured)
targets:
  cutoff_um: 3.6236           # kappa_g x(1.04e-4) w_c 125
  filtrate_fraction: 0.72923  # outlet identity at the text's final side width 144 um
process: {depth_um: 150, gap_um: 17.1, post_length_um: 34.3, post_width_um: 70.8, min_feature_um: 4.5, min_radius_um: 1.8, fillet_um: 2.0}
centre_channel: {taper: constant, width_in_um: 125}
layout: {style: paperclip, legs: 7}
meander: {enabled: false}
inlet: {style: plain, port_radius_um: 300}
outlet: {style: ring, port_radius_um: 750, centre_port_radius_um: 300}
operation: {flow_uL_min: 55}
gates: {mode: reproduce}
start: {style: floor, side_width_um: 40.0}
reproduction: {pc_last_short: 257, leg_Y: [0, 3491.4, -587.8, 4079.3, -1175.4, 4666.8, -1764.3]}
paper:
  source: Gifford et al. 2014, Fig. 6 and pp. 4498, 4502
  source_trace: "provenance/rc7_traces/results/gifford/gifford6_results_aligned.json and gifford6_results_aligned_onemap.json (Fig. 6)"   # rc7 (ADJ-C6, code review R10): the trace record of this mask against the figures
  measured_on_figure: [leg 1's side channels 58.5 / 59.3 um at its end (rc6 record) -> start 40.1 um, 40 drawn;
    G 17.08 um and posts 34.3 um along the flow (rc6 gifford_fig6_measurement.json)]
