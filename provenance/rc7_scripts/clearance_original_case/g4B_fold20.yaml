# Gifford 2014, Fig. 4 bead device -- ALIGNED reproduction (rc7; reading B of register GIF4-1 / INV-2): Gifford's printed
# design with every printed value (f_gap 3.34e-4 at w_c 100 um, depth 80 um, final side width 300 um, four legs, his
# start rule), every gap from row 4 on at the cutoff D and rows 1-3 above it, declared (the frozen physics exact on the
# drawing; the start rule is App. A's "other start mode", A:1118-1119, a fictitious start flow 2 sigma0 = 0.0022 that
# the sealed drawing realises as those three off-design rows; the 8 um row-1 side channel is narrower than the 10.2 um
# particles they pass; code review R9, foundation check 2), and the figure's measurements.  No reading fits all the
# evidence; this one is the best-supported compromise (register INV-2):
#   layout: the four legs side by side IN PATH ORDER (layout.order: path; 818 um apart, M), so the leg beside leg 4 on
#     the inset is leg 3, not leg 2.  Its cost, three source items: the caption's "the second and fourth legs"; the
#     schematic's topology (its "not drawn to scale" is about scale, not about which leg neighbours which); the same
#     paper's Fig. 6, nested by its arrows (stated in the dissertation, as the paper's other caption-text conflicts).
#     Leg 4's array ends 8.2 mm before the others (D, FITTED: the row-fraction law puts the neighbour's 124.7 um side
#     channels (M) there; the schematic's inset box, a scale feature, is not counted as support).
#   start: Gifford's rule (p. 4498: w_s(1) "close to or equal to zero, depending on the device production capabilities
#     available") at an 8 um first side channel, the "10 : 1 aspect ratio limitation" he states (p. 4503) at 80 um depth
#     (A, an inference): rows 1-3 extract above D (row 1 at about 2 D, 0.5 % of the filtrate), so the earliest side
#     fluid is nearly bead-free, as the inset's side channels show (register INV-2: their outer band holds 2 beads where
#     >= 98 are expected for any start that admits the inlet suspension).
#   gap 17.2 um, posts 28.6 um along the flow (row pitch 45.8 um unchanged): M, measured on the inset (the posts'
#     flanks along the flow) at search half-windows of 3.5 and 6 px (9.8 and 16.7 um, both shorter than the gap; register
#     GIF4-2, GIF4-3) and checked at the rc7 trace window (3 px, 8.37 um, at most half the gap; the package's measure
#     step); the gap does not enter the side-channel schedule.
# Rejected readings (register INV-2): C, a 51 um start (fits leg 2 only through a start flow the beads rule out;
#   provenance/rc7_traces/variants/gifford2014_fig4_start51.yaml); D, a larger f over legs 1-2 (contradicts the single
#   printed f_gap).  The design-level preset (gifford2014_fig4_design: sealed, nested) is the reference.
name: g4B_fold20
description: Gifford 2014 Fig. 4 bead device, aligned with the Fig. 4 inset (printed design and start rule; legs in path order; 17.2 um gap measured)
targets:
  cutoff_um: 5.203174831309222      # kappa_g x(f_gap 3.34e-4) w_c 100
  filtrate_fraction: 0.90644        # outlet identity at the printed final side width 300 um
process: {depth_um: 80, gap_um: 20.5, post_length_um: 25.3, post_width_um: 59.5, min_feature_um: 20, fillet_um: 2.5}
centre_channel: {taper: constant, width_in_um: 100}
layout: {style: paperclip, legs: 4, leg_spacing_um: 818, order: path}
meander: {enabled: true, style: pack, seal: require, seam_side_width_um: 20}
inlet: {style: plain, port_radius_um: 300}
outlet: {style: separate, port_radius_um: 750, centre_port_radius_um: 300}
gates: {mode: reproduce}
reproduction:
  pc_last_short: 8200.0   # D, fitted: leg 4's array ends 8.2 mm before the others (the neighbour leg 3's width on the inset)
  stem_half: 300.0
  W: 2400.0
paper:
  source: Gifford et al. 2014, Fig. 4 and pp. 4496-4500, 4503
  source_trace: "provenance/rc7_traces/results/gifford/gifford_results_aligned.json (Fig. 4 inset)"   # rc7 (ADJ-C6, code review R10): the trace record of this mask against the figures
  layout: "Fig. 4 caption: 'the second and fourth legs of the device'; schematic nested (not to scale). This reading:
    legs in path order, the inset's legs 3 and 4 (register GIF4-1, B; INV-2)"
  measured_on_figure: [the neighbour's side channels 124.5 / 124.96 um (50 profiles), leg spacing 817.9 um, G 17.2 um and
    posts 28.6 um along the flow]
  assumed: [start side width 8 um (Gifford's 10 : 1 limitation at 80 um), port radii (schematic not to scale)]
