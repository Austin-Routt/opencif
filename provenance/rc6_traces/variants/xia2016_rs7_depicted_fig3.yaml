# rc6 VARIANT (not a preset): xia2016_rs7_depicted with BOTH decoupled targets read off Fig. 3 instead of the text:
#   F 0.9407157 (15.87 : 1) -- the F at which the schedule's last side channel equals Fig. 3g's, 624.6 um outline to outline
#     at the rc6 scale (results/xia/xia_results_rc6.json); the printed ~15 : 1 (F 0.938) draws 600 um (V5 across 1.038);
#   D 6.570535 um (x 0.9572 of the printed-f_ref 6.8644) -- the cutoff at which the rows fill Fig. 3a's legs at that F
#     (N 8106: xia_leg_fill.py's goal, 1190 rows per full leg at the 51.78 um pitch).
# Solved alternately (F for the width at the current D, D for the rows at that F): provenance/rc6_traces/code/
# xia_fig3_fit.py -> results/xia/xia_fig3_fit.json.  The variant xia2016_rs7_depicted_dfill moves D alone (F printed).
# A reading of the figures under the model's premises (the frozen cutoff law's kernel, the plateau prefactor, the
# 300 -> 150 um constant-shear taper), not of the text; built and traced to test panel g's wall and Fig. 3a together.
# Xia 2016 RS-7, the head AS DEPICTED (Figs. 3b + 3a), reproduced from its decoupled targets (here: read off the figures).
name: xia2016_rs7_depicted_fig3
description: Xia 2016 RS-7 -- constant-shear taper 300 -> 150 um, hairpin head, 7-leg paperclip (Fig. 3a axes), ring outlet
targets: {cutoff_um: 6.570535180059767, filtrate_fraction: 0.9407157272549905}
process: {depth_um: 140, gap_um: 16, post_length_um: 35.8, post_width_um: 70.9, min_feature_um: 16, min_radius_um: 4.5}
centre_channel: {taper: constant_shear, width_in_um: 300, width_min_um: 150}
layout: {style: paperclip, legs: 7}
meander: {enabled: true, style: hairpins, channel_um: 22.8, wall_um: 35.8, head_width_um: 1840, seal: allow,
          transition: paper, rectilinear_rows: 9, seam_side_width_um: 16, seam_at: post}
inlet: {style: plain, port_radius_um: 862, stem_half_width_um: 166, port_gap_um: 591}
outlet: {style: ring, port_radius_um: 1718, centre_port_radius_um: 1723,
         tubing: {centre_id_mm: 0.25, side_id_mm: 0.86, length_m: 0.15},
         ring: {radius_um: 4195, centre_offset_um: 1191, filtrate_port_offset_um: 4781, turn_radius_um: 250}}
gates: {mode: reproduce}
reproduction:
  margin: 20.0
  ws_rect: 22.8
  leg_Y: [0.0, 1332.0, -1745.0, 2229.0, -2650.0, 3267.0, -3975.0]
  pc_inlet_offset: 2553.0
  pc_out_ext: 3441.0
  loop_pull_in: 2.0
  loop_pull_in_leg: true
  loop_ramp: 40.0
  depicted_head: xia
paper:
  source: Xia et al. 2016 Sci. Rep., Figs. 1, 3 and p. 4; tubing length 0.15 m assumed (only the I.D.s are printed); rc6 -- Fig. 3 panels b-g read at 1.798 um/px (their printed widths and loop curvature; the panel-i bar gives 1.936), Fig. 3a at its bar read with its anti-aliased ends (x 1.003827)
# flow: Xia ran RS-7 at "~1 mL/min" (line 18) and ">0.75 mL/min" (line 244); 800 uL/min is used (printed range)
operation: {flow_uL_min: 800}
