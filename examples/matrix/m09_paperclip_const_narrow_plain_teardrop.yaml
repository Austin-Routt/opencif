# Variant matrix (pairwise covering of layout x taper x meander style x inlet x outlet), one base design:
# D 4.0 um, F 0.5, 100 um deep, 19 um gaps and floor, w_c 80 um (u_min 0.05: inside the kappa plateau).
# The narrow head (opt-in, this project's): process-floor units for the first rows seal gap 1 in less channel (a 19 um
# channel has 3x the resistance per length of a 28 um one) at the cost of 3x the sensitivity to width error; the
# full-width units after it restart taller.  Not in any paper; the default head is the packing arms head.
name: m09_paperclip_const_narrow_plain_teardrop
targets: {cutoff_um: 4.0, filtrate_fraction: 0.5}
process: {depth_um: 100, gap_um: 19, post_length_um: 27, post_width_um: 50, min_feature_um: 19}
chip: {width_mm: 12, length_mm: 30, margin_um: 1000}
centre_channel: {taper: constant, width_in_um: 80}
layout: {style: paperclip, legs: auto}
meander: {enabled: true, style: narrow, channel_um: 28, wall_um: 27, seal: require}
inlet: {style: plain, port_radius_um: 750}
outlet: {style: teardrop, port_radius_um: 750, centre_port_radius_um: 750}
gates: {mode: strict}
