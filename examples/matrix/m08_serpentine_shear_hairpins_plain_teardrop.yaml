# Variant matrix (pairwise covering of layout x taper x meander style x inlet x outlet), one base design:
# D 4.0 um, F 0.5, 100 um deep, 19 um gaps and floor, w_c 80 um (u_min 0.05: inside the kappa plateau).
# Xia 2016's hairpins head as published: at these targets it cannot seal gap 1 (its first unit would need ~24 mm of
# channel), so it is drawn unsealed in a 4 mm head (Xia's RS-7: 2 mm) with gap 1 declared (seal: allow, gates.mode:
# evaluate; gap 1 extracts 6.4 f*, cutoff 10.2 um) and every other gap checked.
name: m08_serpentine_shear_hairpins_plain_teardrop
targets: {cutoff_um: 4.0, filtrate_fraction: 0.5}
process: {depth_um: 100, gap_um: 19, post_length_um: 27, post_width_um: 50, min_feature_um: 19}
chip: {width_mm: 12, length_mm: 30, margin_um: 1000}
centre_channel: {taper: constant_shear, width_in_um: 80, width_min_um: 56}
layout: {style: serpentine, legs: auto}
meander: {enabled: true, style: hairpins, channel_um: 28, wall_um: 27, head_width_um: 4000, seal: allow}
inlet: {style: plain, port_radius_um: 750}
outlet: {style: teardrop, port_radius_um: 750, centre_port_radius_um: 750}
gates: {mode: evaluate}
